version: 2.1

jobs:
  tbl_DeviceEnum:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Assert the empty state count is 6
          command: |
            mkdir -p /var/tmp/_data
            set +o pipefail 2>/dev/null; (IFS=,; set -- $(seq 1 100 | tr '\n' ','); printf '%s\n' "$@") > /var/tmp/_data/silver65; true
            sha256sum /var/tmp/_data/silver65 | awk '{print "sha256-b:",substr($1,1,16)}'
      - persist_to_workspace:
          root: /var/tmp/_data
          paths:
            - 'silver65'
  v1-nightly4:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/_data
      - run:
          name: Weigh gate output
          command: |
            awk 'BEGIN{for(i=1;i<ARGC;i++)print "arg:",ARGV[i]}' /var/tmp/_data/silver65 2>/dev/null || true
      - run:
          name: Fetch repository
          command: git clone --depth 2 -q --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: bzcat raw-panels.tar.bz2 | tar xf -
