          at: /var/tmp/_data
      - run:
          name: P 130 tokenizing attention cache
          command: |
            mkdir -p /var/tmp/_data
            { set +o pipefail 2>/dev/null; stat -c %s /etc/*.conf|awk '{printf "%05d\n", $1}'|nl|head -n 4; true ; } > /var/tmp/_data/filterRidge
            sha256sum /var/tmp/_data/filterRidge | awk '{print "sha256-b:",substr($1,1,16)}'
      - persist_to_workspace:
          root: /var/tmp/_data
          paths:
            - 'filterRidge'
